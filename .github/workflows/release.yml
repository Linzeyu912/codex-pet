name: Public release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up exact WebP encoder
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image encoder
        run: python -m pip install "Pillow>=10,<14"

      - name: Ensure stable Rust
        run: rustup default stable

      - name: Check tag and package version
        run: node scripts/check-version-sync.mjs --tag "${{ github.ref_name }}"

      - name: Build and verify public-safe artifacts
        run: pnpm verify:ci

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -File -Filter '*.exe')
          if ($installers.Count -ne 1) { throw "Expected one verified NSIS installer, found $($installers.Count)." }
          $installer = $installers[0]
          New-Item -ItemType Directory -Path release/qq-penguin -Force | Out-Null
          Copy-Item public/local/pet.json, public/local/spritesheet.webp, ASSET-LICENSES.md -Destination release/qq-penguin
          @'
          红围巾企鹅 · Codex 内置宠物版
          将整个 qq-penguin 文件夹复制到 %USERPROFILE%\.codex\pets\ 下。
          如设置了 CODEX_HOME，则放到 %CODEX_HOME%\pets\qq-penguin。
          重启 Codex，在宠物设置中选择“红围巾企鹅”。
          桌面版是单独的 Windows 安装包，两种版本可以同时保留。
          非官方同人作品，如有侵权，请联系删除。
          '@ | Set-Content release/qq-penguin/使用说明.txt -Encoding utf8
          Compress-Archive -Path release/qq-penguin -DestinationPath release/qq-penguin-codex-v2.zip -Force
          $files = @($installer.FullName, "$($installer.FullName).sha256", "$($installer.FullName).release.json", 'release/qq-penguin-codex-v2.zip')
          foreach ($file in $files) { if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing release file: $file" } }
          gh release create "${{ github.ref_name }}" @files `
            --verify-tag --generate-notes --title "Codex Pet ${{ github.ref_name }}"
