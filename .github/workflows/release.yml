name: Public release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CODEX_PET_FORCE_PLACEHOLDER: "1"
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure stable Rust
        run: rustup default stable

      - name: Check tag and package version
        run: node scripts/check-version-sync.mjs --tag "${{ github.ref_name }}"

      - name: Build and verify public-safe artifacts
        run: pnpm verify:ci

      - name: Publish GitHub release
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object {
            $_.Name -match '^Codex-Pet-.+-portable\.(zip|build-manifest\.json)$' -or
            $_.Name -match '^Codex-Pet-.+-portable\.zip\.sha256$'
          }
          if (-not $files) { throw 'No public release files were generated.' }
          gh release create "${{ github.ref_name }}" @($files.FullName) `
            --verify-tag --generate-notes --title "Codex Pet ${{ github.ref_name }}"
